<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mother's Day Collection - Frido</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- css sheets path -->
    <link rel="stylesheet" href="src/css/style.css">
    <link rel="stylesheet" href="src/css/modal.css">
</head>
<body>

    <img src="assets/cover.jpg" alt="Mother's Day" class="header-cover">

    <div class="header">
        <h1>🌸 Find Her Comfort 🌸</h1>
        <p>Gift Comfort to your Comfort this Mother's Day</p>
    </div>

    <div class="products-container">
        <div class="products-grid" id="products-grid">
            <!-- cards rendering here -->
        </div>
    </div>

    <!-- size modal -->
    <div id="modal" class="modal">
        <div class="modal-box">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            <h3>Select a Size</h3>
            <div id="size-list" class="size-list"></div>
        </div>
    </div>

    <div id="error-popup" class="error-popup">
    <div class="error-popup-content">
        <p>Please select a size first!</p>
        <button onclick="closeErrorPopup()">OK</button>
    </div>
    </div>

    <script defer src="src/js/api.js"></script>
    <script defer src="src/js/app.js"></script>

</body>
</html>
