<!-- reusable card component template -->
 
<div class="product-card" id="card-{{id}}">
    <div class="card-image">
        <img src="{{image}}" alt="{{title}}">
    </div>

    <div class="card-content">
        <div class="product-title-wrap">
            <h3 class="product-title">{{title}}</h3>
        </div>
        <p class="product-vendor">{{vendor}}</p>

        <div class="price-row">
            <div class="price-info">
                <span class="discount-badge">{{discount}}% OFF</span>
                <div class="prices">
                    <span class="original-price">₹{{comparePrice}}</span>
                    <span class="sale-price">₹{{salePrice}}</span>
                </div>
            </div>
            <span class="size-display" id="size-{{id}}">Size: -</span>
        </div>

        <div class="card-buttons">
            <button class="select-size-btn" onclick="openSizeModal('{{id}}')">Select Size</button>
            <button class="add-to-cart-btn" id="cartbtn-{{id}}" onclick="addToCart('{{id}}', {{salePrice}})">Add to Cart</button>
        </div>
    </div>
</div>
